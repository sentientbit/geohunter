# A living list of rules following the Effective Dart guide.
# https://www.dartlang.org/guides/language/effective-dart
#
# Note: not everything suggested in the guide has a rule associated with it.

analyzer:
  errors:
    lines_longer_than_80_chars: ignore
    # Causes false positives (https://github.com/dart-lang/sdk/issues/41571)
    #top_level_function_literal_block: ignore
    avoid_classes_with_only_static_members: error
    #sort_pub_dependencies: error
    #use_key_in_widget_constructors: error
    #always_use_package_imports: error
    #sort_constructors_first: error
    #prefer_const_constructors: error    

linter:
  rules:
    avoid_classes_with_only_static_members: false
    sort_pub_dependencies: false
    #use_key_in_widget_constructors: true
    #always_use_package_imports: true
    #prefer_const_constructors: true
    # Conflicts with the convention used by flutter, which puts `Key key`
    # and `@required Widget child` last.
    always_put_required_named_parameters_first: false
    slash_for_doc_comments: true
    #sort_constructors_first: true