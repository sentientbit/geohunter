name: geohunter
description: Location based scavenger hunt game with a RPG questline which takes place in real life.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html

# versionCode AUTOINCREMENTED in android/app/build.gradle versionCode +1
version: 1.1.79

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # https://api.flutter.dev/flutter/material/Icons-class.html
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.0

  flutter_localizations:
    sdk: flutter

  dio: ^5.4.3
  double_back_to_close_app: ^2.0.1
  encrypt: ^5.0.0
  flame_audio: ^2.10.1
  flutter_countdown_timer: ^4.0.0
  #flutter_local_notifications: ^9.6.0
  flutter_map: ^8.1.0
  get_it: ^7.2.0
  geolocator: ^9.0.0
  image_picker: ^1.0.0
  intl: ^0.20.2
  latlong2: ^0.9.0
  loading_overlay: ^0.3.0
  logger: ^2.3.0
  mobile_scanner: ^3.0.0
  qr_flutter: ^4.0.0
  shared_preferences: ^2.0.6
  url_launcher: ^6.0.6
  workmanager: ^0.9.0
  percent_indicator: ^4.2.2
  rxdart: ^0.27.0
  flutter_offline: ^6.0.0
  flutter_secure_storage: ^9.0.0
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  go_router: ^17.2.3
  json_annotation: ^4.9.0

dependency_overrides:
  # Force newer transitive deps that dropped v1 Flutter plugin embedding
  flutter_plugin_android_lifecycle: ^2.0.34
  # flame_audio 2.11+ requires audioplayers 6.x whose Android impl (5.2.1)
  # doesn't compile with Kotlin 2.1. Pin to the 2.10.1 / audioplayers 5.x chain.
  flame_audio: 2.10.1
  audioplayers: 5.2.1
  audioplayers_android: 4.0.3
  audioplayers_platform_interface: 6.1.0
  audioplayers_darwin: 5.0.2
  audioplayers_linux: 3.1.0
  audioplayers_web: 4.1.0
  audioplayers_windows: 3.1.0

dev_dependencies:
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.0
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter_icons:
  # How to regenerate icons
  # flutter pub run flutter_launcher_icons:main
  image_path_android: "assets/images/icon-512.png"
  image_path_ios: "assets/images/icon-512.png"
  android: true # can specify file name here e.g. "android"
  ios: true # can specify file name here e.g. "ios"
  # image_path: "assets/icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/avatars/
    - assets/images/blueprints/
    - assets/images/enemies/
    - assets/images/items/
    - assets/images/markers/
    - assets/images/materials/
    - assets/images/placeholders/
    - assets/images/research/
    - assets/achievements/first_wood.png
    - assets/map_style.json
    - assets/map_style_aubergine.json
    - assets/fonts/CustomIcon.ttf
    - assets/secrets.json
    - assets/i18n/ro.json
    - assets/i18n/en.json
    - assets/audio/music/
    - assets/audio/sfx/

  fonts:
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
    - family: Cormorant SC
      fonts:
        - asset: assets/fonts/CormorantSC-Bold.ttf
          weight: 700
        - asset: assets/fonts/CormorantSC-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/CormorantSC-Light.ttf
          weight: 300
    - family: RPGAwesome
      fonts:
        - asset: assets/fonts/RPGAwesome.ttf
